    <rect x="11.5" y="5" width="4" height="3.4" rx="1.7"/><rect x="17" y="5" width="4" height="3.4" rx="1.7"/><rect x="22.5" y="5" width="4" height="3.4" rx="1.7"/>
    <rect x="6" y="11" width="4" height="3.4" rx="1.7"/><rect x="11.5" y="11" width="4" height="3.4" rx="1.7"/><rect x="22.5" y="11" width="4" height="3.4" rx="1.7"/>
    <rect x="6" y="17" width="4" height="3.4" rx="1.7"/><rect x="17" y="17" width="4" height="3.4" rx="1.7"/><rect x="22.5" y="17" width="4" height="3.4" rx="1.7"/>
